name: Global Market validation

on:
  push:
    branches:
      - feature/global-market-readiness
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "supabase/diagnostics/**"
      - "supabase/functions/**"
      - "docs/GLOBAL_MARKET_*.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/global-market-validation.yml"
  pull_request:
    branches:
      - admin-portal-repair
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "supabase/diagnostics/**"
      - "supabase/functions/**"
      - "docs/GLOBAL_MARKET_*.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/global-market-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-market-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Deno for Edge Function validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check OpenAI Edge Function
        run: deno check supabase/functions/bizguard-ai/index.ts

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
